<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>
    <link rel="stylesheet" href="movies.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <nav>
        <div class="navbar">
            <div class="logo">
                <h1>
                    <i class="fa-solid fa-film"></i>
                    Movie Guide App
                </h1>
            </div>

            <div class="search-container">

                <form>
                    <div class="input-container">
                        <input type="text" placeholder="Search movie... "class="input-box">

                        <buttontype="button" class="clear-btn">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <button type="submit" class="search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i> Search </button>
                </form>

            </div>
        </div>
    </nav>

    <main>

        <section>
            <div class="movie-container">
                <div class="message">
                    <i class="fa-solid fa-film"></i>
                    <h2>Search Movie Details Here...</h2>
                    <p>Enter a movie name above to get movie information. </p>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p> &copy; 2026 Movie Guide App </p>
    </footer>  
    <script src="movies.js"></script>
</body>
</html>
